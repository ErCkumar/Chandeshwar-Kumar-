<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chandeshwar Weather App</title>
    <style>
        * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .search-box { 
        display: flex; 
        gap: 12px; 
        margin-bottom: 30px; 
        }
        .search-box input {
            flex: 1; 
            padding: 14px 20px; 
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.15); 
            color: #fff; 
            font-size: 16px; 
            outline: none;
        }
        .search-box input::placeholder { 
            color: rgba(255,255,255,0.6); }
        .search-box button {
            padding: 14px 20px; 
            border: none; 
            border-radius: 16px;
            background: rgba(255,255,255,0.2); 
            color: #fff; 
            cursor: pointer; 
            font-size: 18px;
        }
        .search-box button:hover { 
            background: rgba(255,255,255,0.35); 
        }
        .weather-info { 
            text-align: center; 
            color: #fff; 
            min-height: 300px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; }
        .city { 
            font-size: 28px; 
            font-weight: 600; 
            margin-bottom: 4px; 
        }
        .date { 
            font-size: 14px; 
            opacity: 0.7; 
            margin-bottom: 20px; 
        }
        .temp { 
            font-size: 72px; 
            font-weight: 700; 
            line-height: 1; 
            margin-bottom: 10px; 
        }
        .temp sup { 
            font-size: 28px; 
            font-weight: 400; 
        }
        .description { 
            font-size: 18px; 
            text-transform: capitalize; 
            margin-bottom: 24px; 
            opacity: 0.9; 
        }
        .weather-icon { 
            width: 80px; 
            height: 80px; 
            margin: 0 auto 16px; 
        }
        .weather-icon img { 
            width: 100%; 
            height: 100%; 
        }
        .details { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            margin-top: 10px; 
        }
        .detail-card { 
            background: rgba(255,255,255,0.1); 
            border-radius: 16px; 
            padding: 16px 10px; 
            text-align: center; 
        }
        .detail-card .label { 
            font-size: 12px; 
            opacity: 0.7; 
            margin-bottom: 6px; 
        }
        .detail-card .value { 
            font-size: 18px; 
            font-weight: 600; 
        }
        .error-msg { 
            color: #ff6b6b; 
            font-size: 16px; 
            margin-top: 16px; 
        }
        .loading { 
            color: rgba(255,255,255,0.8); 
            font-size: 18px; 
        }
        .spinner {
            width: 40px; 
            height: 40px; 
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff; 
            border-radius: 50%;
            animation: spin 0.8s ease-in-out infinite; 
            margin: 40px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .default-msg h2 { 
            font-size: 22px; 
            margin-bottom: 8px; 
            font-weight: 400; }
        .unit-toggle { 
            margin-bottom: 20px; 
            display: flex; 
            justify-content: center; 
            gap: 8px; 
        }
        .unit-toggle button {
            padding: 6px 16px; 
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px; 
            background: transparent; 
            color: rgba(255,255,255,0.6);
            cursor: pointer; 
            font-size: 14px; 
            transition: all 0.3s;
        }
        .unit-toggle button.active { 
            background: rgba(255,255,255,0.2); 
            color: #fff; 
            border-color: rgba(255,255,255,0.5); 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name..." onkeydown="if(event.key==='Enter') getWeather()">
            <button onclick="getWeather()">🔍</button>
        </div>
        <div class="unit-toggle">
            <button id="unitC" class="active" onclick="setUnit('metric')">°C</button>
            <button id="unitF" onclick="setUnit('imperial')">°F</button>
        </div>
        <div class="weather-info" id="weatherInfo">
            <div class="default-msg">
                <h2>🌤️ Weather App</h2>
                <p>Search for a city to get started</p>
                <p>made by chandeshwar</p>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '073fc1e66ed40953e74d75faaed701d2';
        let currentUnit = 'metric';
        let currentData = null;

        function setUnit(unit) {
            currentUnit = unit;
            document.getElementById('unitC').classList.toggle('active', unit === 'metric');
            document.getElementById('unitF').classList.toggle('active', unit === 'imperial');
            if (currentData) displayWeather(currentData);
        }

        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) return;

            const info = document.getElementById('weatherInfo');
            info.innerHTML = '<div class="spinner"></div><div class="loading">Fetching weather...</div>';

            try {
                const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.cod === '404' || data.cod === 404) {
                    info.innerHTML = `<div class="error-msg">❌ City not found. Please try again.</div>`;
                    return;
                }
                if (data.cod === 401) {
                    info.innerHTML = `<div class="error-msg">⚠️ Invalid API key. Please check your API key.</div>`;
                    return;
                }

                currentData = data;
                displayWeather(data);
            } catch (error) {
                info.innerHTML = `<div class="error-msg">❌ Network error. Please check your connection.</div>`;
            }
        }

        function displayWeather(data) {
            const info = document.getElementById('weatherInfo');
            const temp = currentUnit === 'metric' ? data.main.temp : (data.main.temp * 9/5 + 32);
            const feelsLike = currentUnit === 'metric' ? data.main.feels_like : (data.main.feels_like * 9/5 + 32);
            const unitSymbol = currentUnit === 'metric' ? '°C' : '°F';
            const windSpeed = currentUnit === 'metric' ? `${data.wind.speed} m/s` : `${(data.wind.speed * 2.237).toFixed(1)} mph`;

            const date = new Date();
            const dateStr = date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            const iconCode = data.weather[0].icon;
            const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

            info.innerHTML = `
                <div class="city">${data.name}, ${data.sys.country}</div>
                <div class="date">${dateStr}</div>
                <div class="weather-icon"><img src="${iconUrl}" alt="${data.weather[0].description}"></div>
                <div class="temp">${Math.round(temp)}<sup>${unitSymbol}</sup></div>
                <div class="description">${data.weather[0].description}</div>
                <div class="details">
                    <div class="detail-card"><div class="label">Feels Like</div><div class="value">${Math.round(feelsLike)}${unitSymbol}</div></div>
                    <div class="detail-card"><div class="label">Humidity</div><div class="value">${data.main.humidity}%</div></div>
                    <div class="detail-card"><div class="label">Wind</div><div class="value">${windSpeed}</div></div>
                </div>
            `;
        }
    </script>
</body>
</html>
